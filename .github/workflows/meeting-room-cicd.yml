name: MeetFlow CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # PHASE 1 & 2: CONTINUOUS INTEGRATION (AUTOMATED CHECKS & TESTS)
  # ============================================================================
  ci:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest

    env:
      # Isolated test environment variables (zero access to production secrets)
      SECRET_KEY: "ci-test-secret-key-meeting-platform-for-automated-validation-123456789"
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      DATABASE_URL: "sqlite:///ci_test_db.sqlite3"
      DJANGO_SETTINGS_MODULE: "config.settings.development"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run Django System Checks
        run: |
          python src/manage.py check

      - name: Run Django Automated Unit & Integration Tests
        run: |
          python src/manage.py test apps --verbosity=2

      - name: Run Standalone Webhook Events Verification Suite
        run: |
          python test_webhooks.py

      - name: Run Production Deployment Readiness Check
        run: |
          # Evaluates Django security settings against production configuration
          python src/manage.py check --deploy --settings=config.settings.production

      - name: Validate Static Asset Collection
        run: |
          # Verifies WhiteNoise static asset bundling works without missing files
          python src/manage.py collectstatic --noinput

  # ============================================================================
  # PHASE 3: SECURE CONTINUOUS DEPLOYMENT TO AWS EC2
  # ============================================================================
  deploy:
    name: Deploy to AWS EC2
    needs: [ci]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Validate AWS EC2 Secrets Configuration
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "❌ Error: Required secret 'EC2_HOST' is not configured in GitHub Secrets."
            exit 1
          fi
          if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "❌ Error: Required secret 'EC2_SSH_KEY' is not configured in GitHub Secrets."
            exit 1
          fi
          echo "✅ EC2 deployment credentials validation passed."

      - name: Configure Secure SSH Client
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          SSH_PORT="${{ vars.EC2_PORT || '22' }}"
          echo "Scanning known hosts for ${{ secrets.EC2_HOST }}:${SSH_PORT}..."
          ssh-keyscan -p "${SSH_PORT}" -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

      - name: Execute Deployment on AWS EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER || 'ubuntu' }}
          EC2_PORT: ${{ vars.EC2_PORT || '22' }}
          TARGET_DIR: ${{ vars.TARGET_DIR || '/home/ubuntu/meeting-room' }}
          TARGET_BRANCH: "main"
          DAPHNE_SERVICE: ${{ vars.DAPHNE_SERVICE || 'daphne' }}
          CELERY_SERVICE: ${{ vars.CELERY_SERVICE || 'celery' }}
          NGINX_SERVICE: ${{ vars.NGINX_SERVICE || 'nginx' }}
          HEALTH_CHECK_URL: ${{ vars.HEALTH_CHECK_URL || 'http://127.0.0.1:8000/test-auth/' }}
        run: |
          echo "Connecting to ${EC2_USER}@${EC2_HOST}:${EC2_PORT} to deploy commit ${{ github.sha }}..."

          # Stream deployment script safely over SSH with configured variables
          ssh -i ~/.ssh/id_rsa -p "${EC2_PORT}" -o StrictHostKeyChecking=yes -o BatchMode=yes "${EC2_USER}@${EC2_HOST}" \
            "TARGET_DIR='${TARGET_DIR}' \
             TARGET_BRANCH='${TARGET_BRANCH}' \
             DAPHNE_SERVICE='${DAPHNE_SERVICE}' \
             CELERY_SERVICE='${CELERY_SERVICE}' \
             NGINX_SERVICE='${NGINX_SERVICE}' \
             HEALTH_CHECK_URL='${HEALTH_CHECK_URL}' \
             bash -s" < scripts/deploy.sh

      - name: Deployment Completion Summary
        run: |
          echo "===================================================================="
          echo "✅ Deployment completed successfully for commit: ${{ github.sha }}"
          echo "Target Host: ${{ secrets.EC2_HOST }}"
          echo "===================================================================="

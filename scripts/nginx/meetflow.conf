# ==============================================================================
# Nginx Reverse Proxy Configuration for MeetFlow Platform (HTTP + WebSockets)
# ==============================================================================

upstream daphne_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    # Static files served directly by Nginx (optional if WhiteNoise is active)
    location /static/ {
        alias /home/ubuntu/meeting-room/src/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Media uploads
    location /media/ {
        alias /home/ubuntu/meeting-room/src/media/;
        expires 7d;
    }

    # Daphne ASGI Application (HTTP & WebSocket reverse proxy)
    location / {
        proxy_pass http://daphne_backend;
        proxy_http_version 1.1;

        # WebSocket support headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

{% extends 'base.html' %}

{% block title %}MeetFlow | Sign In Via Google{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-5 min-vh-75">
    <div class="col-12 col-md-8 col-lg-5 col-xl-4">
        <div class="glass-panel p-4 p-md-5 rounded-5 shadow-2xl fade-in-up text-center">
            <div class="d-inline-flex align-items-center justify-content-center mb-3 brand-icon-badge shadow-lg">
                <svg width="24" height="24" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                    <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.259h2.908c1.702-1.567 2.684-3.874 2.684-6.617z" fill="#FFFFFF"/>
                </svg>
            </div>
            <h2 class="fw-bold text-dark mb-2">Sign In Via Google</h2>
            <p class="text-secondary small mb-4">
                You are about to sign in using your Google account.
            </p>
            
            <a href="{% url 'google_login' %}" class="btn btn-hero-primary w-100 py-3 rounded-4 font-display fw-bold fs-6 mb-3 shadow-lg text-white text-decoration-none d-inline-block">
                <i class="bi bi-box-arrow-in-right me-2"></i> Proceed to Google
            </a>
            
            <div class="mt-3 pt-3 border-top border-slate-200">
                <a href="{% url 'login' %}" class="text-secondary small text-decoration-none hover-primary">
                    <i class="bi bi-arrow-left me-1"></i> Back to Sign In
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
